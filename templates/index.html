<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Product Search</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; margin-bottom: 24px; }
    input[type=text] { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; font-size: 16px; }
    .card { display: flex; gap: 16px; padding: 16px 0; border-bottom: 1px solid #ddd; }
    .card img { width: 80px; height: 80px; object-fit: contain; }
    .card h3 { margin: 0 0 4px 0; }
    .price { color: #555; font-weight: bold; }
    .category { color: #888; font-size: 13px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Product Search</h1>
  <form action="/" method="get">
    <input type="text" name="q" value="{{ query }}" placeholder="e.g. something warm for winter" autofocus>
    <button type="submit">Search</button>
  </form>

  {% if query and not results %}
    <p>No results.</p>
  {% endif %}

  {% for product in results %}
    <div class="card">
      <img src="{{ product.image }}" alt="{{ product.title }}">
      <div>
        <h3>{{ product.title }}</h3>
        <div class="price">${{ "%.2f"|format(product.price) }}</div>
        <div class="category">{{ product.category }}</div>
        <p>{{ product.description[:150] }}{% if product.description|length > 150 %}...{% endif %}</p>
      </div>
    </div>
  {% endfor %}
</body>
</html>
